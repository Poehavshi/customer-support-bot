[project]
name = "support-agent"
version = "0.1.0"
description = "An LLM-driven support agent that acts on one order and escalates to a helpdesk when it cannot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.2",
    "langchain-core>=1.6.4",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.16",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "support_agent"
module-root = ""

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["support_agent", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
